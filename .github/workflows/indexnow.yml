name: IndexNow URL notification

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "react-router.config.ts"
      - "vite.config.js"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate sitemap and IndexNow key file
        env:
          SITE_URL: https://ujwalsingh.tech
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const publicDir = path.join(process.cwd(), 'public');
          const sitemap = fs.readFileSync(path.join(publicDir, 'sitemap.xml'), 'utf8');
          const urls = [...sitemap.matchAll(/<loc>\s*(https?:\/\/[^<]+)\s*<\/loc>/g)]
            .map((match) => match[1].trim());

          const host = new URL(process.env.SITE_URL).host;
          const validUrls = urls.filter((url) => {
            try {
              return new URL(url).host === host;
            } catch {
              return false;
            }
          });

          const keyFiles = fs.readdirSync(publicDir).filter((name) => /^[a-f0-9]{32}\.txt$/i.test(name));
          if (keyFiles.length !== 1) {
            throw new Error(`Expected exactly one 32-character IndexNow key file in public/, found ${keyFiles.length}.`);
          }

          const keyFile = keyFiles[0];
          const key = fs.readFileSync(path.join(publicDir, keyFile), 'utf8').trim();
          if (key !== keyFile.replace(/\.txt$/i, '')) {
            throw new Error('IndexNow key file content must match its filename (without .txt).');
          }
          if (validUrls.length === 0) {
            throw new Error('No valid URLs for this domain were found in sitemap.xml.');
          }

          async function main() {
            const keyUrl = `${process.env.SITE_URL}/${keyFile}`;
            const keyResponse = await fetch(keyUrl);
            if (!keyResponse.ok) {
              throw new Error(`IndexNow key file is not publicly reachable: HTTP ${keyResponse.status} at ${keyUrl}`);
            }
            const publishedKey = (await keyResponse.text()).trim();
            if (publishedKey !== key) {
              throw new Error('Public IndexNow key file content does not match the repository key.');
            }

            const response = await fetch('https://api.indexnow.org/indexnow', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                host,
                key,
                keyLocation: keyUrl,
                urlList: validUrls,
              }),
            });

            if (![200, 202].includes(response.status)) {
              const body = await response.text();
              throw new Error(`IndexNow submission failed with HTTP ${response.status}: ${body}`);
            }

            console.log(`IndexNow accepted submission for ${validUrls.length} sitemap URL(s). HTTP ${response.status}.`);
            console.log('Submitted URLs:', validUrls.join('\n'));
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
